name: Problem while testing
description: Report a bug with steps to reproduce it
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and computer
      description: Commit/version, Windows, CPU, GPU, renderer, controller and interface language.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps, expected and observed behavior. Include the music source and manual/Demo mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: Screenshot or reviewed log excerpt. Do not attach ROMs, BIOS, music or personal data.
